[project]
name = "cpomdp-workshop"
version = "0.1.1"
description = "Build a curious rocket — the AII 2026 symposium workshop for cpomdp."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Inferogenesis" }]
keywords = ["active-inference", "cpomdp", "workshop", "teaching"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The pin is the single source of truth for the cpomdp version the workshop was
# measured on; `cpomdp_workshop.WORKSHOP_CPOMDP_VERSION` reads it back from the
# installed metadata, so the notebook and the tests cannot drift from this line.
dependencies = [
    "cpomdp==0.5.1",
    "matplotlib>=3.5",
    "numpy>=1.24",
]

[project.urls]
Repository = "https://github.com/inferogenesis/cpomdp-workshop"

[project.optional-dependencies]
# Local Jupyter. Colab supplies all of this, so it is never installed there.
nb = ["ipykernel>=6.29", "jupyter>=1.1"]
dev = [
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.15",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpomdp_workshop"]

# What the public sdist carries: the package, the notebook and what the tests need to
# run from it. The plan and the delivery notes stay in the repo.
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "scripts",
    "notebooks",
    "assets",
    "delivery/hints_chat.txt",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "PT", "PIE", "ICN",
    "TID", "PERF", "NPY", "RUF", "D",
]
ignore = [
    # The docstrings use real mathematical notation (−, ×, ᵀ); these read those
    # glyphs as ambiguous unicode.
    "RUF001",
    "RUF002",
    "RUF003",
    # Constructors are documented at the class level.
    "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests document themselves by name, and single-letter matrix names there match the
# algebra the assertions are checking.
"tests/**" = ["D", "E741"]
# Generated teaching cells. An attempt leaves a name unused until its slot is written,
# a hint cell is one line naming a variable from its attempt, and scaffold comments
# run long. A bonus cell imports everything it uses, so it runs from its checkpoint
# after a restart, which re-imports names an earlier cell already brought in.
"notebooks/*.ipynb" = ["D103", "E501", "F811", "F821", "F841"]

[tool.ty.environment]
python-version = "3.11"
# The notebook tests import the builder and the lesson from scripts/, as pytest's
# pythonpath does.
extra-paths = ["scripts"]

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The notebook builder and its lesson are scripts, not package modules; the notebook
# tests import them by name.
pythonpath = ["scripts"]
addopts = "-ra"
markers = [
    "slow: tests over a few seconds; deselect with -m \"not slow\"",
]
