# Markdown linting config, read by markdownlint-cli2. Both the pre-commit hook and a
# bare `markdownlint-cli2` run pick this up, so local and CI agree.
# Rule reference: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md

fix: true

config:
  # The structural rules to enforce. All on by default; listed so the intent is
  # documented rather than implied.
  MD022: true # headings surrounded by blank lines
  MD031: true # fenced code blocks surrounded by blank lines
  MD032: true # lists surrounded by blank lines
  MD040: true # every fenced block names its language (```python, ```bash, ...)
  MD012: true # no runs of consecutive blank lines

  # Inline HTML is flagged by default (MD033); allow the two tags used for
  # collapsible <details> dropdowns, which render on GitHub and in Colab.
  MD033:
    allowed_elements:
      - details
      - summary

  # Off, because prose here is wrapped at 88 columns for code and left long for
  # paragraphs, so a line-length rule fights the style.
  MD013: false
  # Only flag duplicate headings that are siblings, so repeated section shapes under
  # different parents pass.
  MD024:
    siblings_only: true

ignores:
  - ".venv/**"
  - ".claude/**"
